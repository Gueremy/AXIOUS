databases:
  - name: axious-db
    databaseName: axious_db
    user: axious_user
    plan: free

services:
  - type: web
    name: axious-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: axious-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: '["https://salmonwise-inventory.vercel.app","http://localhost:5173"]'
      - key: BASE_URL
        value: https://axious-backend.onrender.com
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
