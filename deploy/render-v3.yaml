services:
  - type: web
    name: salmotrack-v3-api
    runtime: python
    repo: https://github.com/Gueremy/AXIOUS
    branch: v3
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: salmotrack-v3-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: SALMOTRACK_BOOTSTRAP_PILOT_BI
        value: "1"
      - key: POWER_BI_PASSWORD
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://salmotrack-v3-qq8r.onrender.com"]'
      - key: FRONTEND_URL
        value: https://salmotrack-v3-qq8r.onrender.com
      - key: BASE_URL
        fromService:
          type: web
          name: salmotrack-v3-api
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: salmotrack-v3
    runtime: static
    repo: https://github.com/Gueremy/salmonwise-inventory
    branch: v3
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: salmotrack-v3-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /operario
        destination: /index.html
      - type: rewrite
        source: /locations/*
        destination: /index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://salmotrack-v3-api-qq8r.onrender.com wss://salmotrack-v3-api-qq8r.onrender.com; worker-src 'self' blob:; form-action 'self'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /sw.js
        name: Cache-Control
        value: no-cache
